name: Release
# Every green CI run on main publishes a release, versioned MAJOR.MINOR.BUILD:
# MAJOR.MINOR comes from Cargo.toml (changed by hand when it is time for the next version),
# BUILD counts the releases of that MAJOR.MINOR (0, 1, 2, ...). The tag vX.Y.Z is created on the
# released commit; install.sh downloads the latest release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # A commit is released once (re-runs of the same CI do not make a new build).
          if git tag --points-at "$sha" | grep -q '^v'; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$sha is already released as $(git tag --points-at "$sha" | grep '^v' | head -n 1)"
            exit 0
          fi
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mm=${base%.*}
          last=$(git tag -l "v$mm.*" | sed "s/^v$mm\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          build=$(( ${last:--1} + 1 ))
          version="$mm.$build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "next release: v$version"
  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          FINE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      - name: Package
        run: |
          name=fine-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release fine
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fine-${{ matrix.target }}
          path: fine-${{ matrix.target }}.tar.gz*
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ needs.version.outputs.tag }}" fine-*.tar.gz* --repo "${{ github.repository }}" --target "${{ needs.version.outputs.sha }}" --generate-notes
