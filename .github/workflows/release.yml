name: Release
# Builds the binaries (dashboard included) and publishes them as a GitHub release, which
# install.sh downloads. Start it by hand from Actions → Release → Run workflow, giving the
# version (e.g. 0.3.0): the tag vX.Y.Z is created on the chosen branch. Pushing a tag like v0.3.0
# works too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare, es. 0.3.0"
        required: true
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency: release
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versione non valida: \"$INPUT\" (usa MAJOR.MINOR.PATCH, es. 0.3.0)"
            exit 1
          fi
          if gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::error::la release v$version esiste già"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          FINE_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      - name: Package
        run: |
          name=fine-${{ matrix.target }}
          tar -czf $name.tar.gz -C target/${{ matrix.target }}/release fine
          shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fine-${{ matrix.target }}
          path: fine-${{ matrix.target }}.tar.gz*
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.version.outputs.version }}" fine-*.tar.gz* --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes
