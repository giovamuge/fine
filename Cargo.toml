[package]
name = "fine"
version = "0.2.0"
edition = "2024"
description = "Personal finance on your own bank data (Enable Banking), powered by your AI subscription via MCP"
license = "MIT"
readme = "README.md"
build = "build.rs"
# The frontend sources are built by build.rs; the generated web/dist is embedded, so
# node_modules and dist must not end up in the crate package.
exclude = ["web/node_modules", "web/dist"]
keywords = ["finance", "mcp", "psd2", "budget", "open-banking"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
# Dashboard: the built frontend (web/dist, generated by build.rs) is embedded in the binary.
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
